<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bitmovin Player - Caption Toggle Button</title>
  <meta charset="UTF-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="text/javascript" src="https://cdn.bitmovin.com/player/web/8/bitmovinplayer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bitmovin-player-ui@4/dist/js/bitmovinplayer-ui.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bitmovin-player-ui@4/dist/css/bitmovinplayer-ui.css"/>

  <style>
    /* DEMO Page CSS */
    .container {
      color: white;
      text-align: center;
    }
    .container a {
      color: white;
    }
    .container h1 {
      margin-bottom: 22px;
      line-height: 66px;
    }
    .container h2 {
      font-weight: normal;
      margin-bottom: 36px;
      line-height: 26px;
    }
    .player-wrapper {
      width: 95%;
      margin: 20px auto;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>
<div class="container">
  <div class="content">
    <div class="player-wrapper">
      <div id="player"></div>
    </div>
  </div>
</div>
<script type="text/javascript">
  const conf = {
    key: 'YOUR_PLAYER_KEY_HERE',
    ui: false,
  };

  const source = {
    hls: 'https://cdn.bitmovin.com/content/assets/sintel/hls/playlist.m3u8',
  };

  const player = new bitmovin.player.Player(document.getElementById('player'), conf);

  // The config-based approach requires UI version 4.20.0 or above.
  const uiConfig = {
    componentLayoutOverrides: {
      CaptionToggleButton: bitmovin.playerui.UIComponentLayoutOverride.Include,
    },
  };
  const uiManager = bitmovin.playerui.UIFactory.buildUI(player, uiConfig)

  player.load(source);
</script>
</body>
</html>
